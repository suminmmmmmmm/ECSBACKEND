name: CI/CD - Board & User Service

on:
  push:
    paths:
      - 'board/**'
      - 'user/**'
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Board properties 생성
      - name: Create board application.properties
        run: |
          mkdir -p board/src/main/resources
          echo "${{ secrets.APPLICATION_PRO }}" > board/src/main/resources/application.properties

      # User properties 생성
      - name: Create user application.properties
        run: |
          mkdir -p user/src/main/resources
          echo "${{ secrets.APPLICATION_USER }}" > user/src/main/resources/application.properties

      # 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: |
          chmod +x board/gradlew
          chmod +x user/gradlew

      # Board 빌드
      - name: Build board with Gradle (bootJar)
        working-directory: board
        run: ./gradlew clean bootJar

      # User 빌드
      - name: Build user with Gradle (bootJar)
        working-directory: user
        run: ./gradlew clean bootJar

      # JAR 이름 정리
      - name: Rename JARs for deployment
        run: |
          cp $(ls board/build/libs/*.jar | head -n 1) board-run.jar
          cp $(ls user/build/libs/*.jar | head -n 1) user-run.jar

      # Board JAR 업로드
      - name: Upload board JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: board-run.jar
          target: /home/ubuntu/server/demo/board

      # User JAR 업로드
      - name: Upload user JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: user-run.jar
          target: /home/ubuntu/server/demo/user

      # Board properties 업로드
      - name: Upload board properties to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: board/src/main/resources/application.properties
          target: /home/ubuntu/server/demo/board/src/main/resources/

      # User properties 업로드
      - name: Upload user properties to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: user/src/main/resources/application.properties
          target: /home/ubuntu/server/demo/user/src/main/resources/

      # EC2 서버에서 실행
      - name: Run board & user on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script_stop: true
          script: |
            set -x
            rm -rf /home/ubuntu/server/web
            mkdir -p /home/ubuntu/server/web
            mv /home/ubuntu/server/demo/board/board-run.jar /home/ubuntu/server/web/board.jar
            mv /home/ubuntu/server/demo/user/user-run.jar /home/ubuntu/server/web/user.jar
            cd /home/ubuntu/server/web
            sudo fuser -k -n tcp 8080 || true
            sudo fuser -k -n tcp 8081 || true
            nohup java -jar board.jar > board.log 2>&1 &
            nohup java -jar user.jar --server.port=8081 > user.log 2>&1 &
            rm -rf /home/ubuntu/server/demo
