name: CI/CD - Monolithic App

on:
  push:
    paths:
      - '**' # 전체 경로 감지 (또는 'src/**', 'build.gradle', 'application.properties' 등으로 좁혀도 됨)
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create application.properties
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.APPLICATION_PRO }}" > src/main/resources/application.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean bootJar

      - name: Rename JAR for deployment
        run: cp $(ls build/libs/*.jar | head -n 1) app.jar

      - name: Upload JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: app.jar
          target: /home/ubuntu/server/app/

      - name: Upload properties to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: src/main/resources/application.properties
          target: /home/ubuntu/server/app/src/main/resources/

      - name: Run app on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script_stop: true
          script: |
            set -x
            cd /home/ubuntu/server/app
            sudo fuser -k -n tcp 8080 || true
            nohup java -jar app.jar > app.log 2>&1 &
